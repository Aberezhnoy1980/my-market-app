spring.application.name=my-market-payment

server.port=${SERVER_PORT:8081}

# Стартовый баланс счёта (задание допускает конфиг/БД/рандом — фиксируем через конфиг для предсказуемости).
payment.initial-balance=${PAYMENT_INITIAL_BALANCE:10000.00}

# JWT валидация токенов от Keycloak для resource server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/my-market}
