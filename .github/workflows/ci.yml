name: CI

on:
  push:
    branches:
      - main
      - module_two_sprint_five_branch
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests with test profile (includes Liquibase check)
        run: ./mvnw -B test -Dspring.profiles.active=test
