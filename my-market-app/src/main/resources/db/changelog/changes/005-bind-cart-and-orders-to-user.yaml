databaseChangeLog:
  - changeSet:
      id: 008-add-user-id-to-cart-and-orders
      author: assistant
      changes:
        - addColumn:
            tableName: cart_items
            columns:
              - column:
                  name: user_id
                  type: BIGINT
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: user_id
                  type: BIGINT

  - changeSet:
      id: 009-fill-user-id-for-existing-data
      author: assistant
      changes:
        - sql:
            sql: |
              UPDATE cart_items
              SET user_id = (SELECT id FROM users WHERE username = 'user')
              WHERE user_id IS NULL;
        - sql:
            sql: |
              UPDATE orders
              SET user_id = (SELECT id FROM users WHERE username = 'user')
              WHERE user_id IS NULL;

  - changeSet:
      id: 010-enforce-user-ownership-constraints
      author: assistant
      changes:
        - dropUniqueConstraint:
            tableName: cart_items
            constraintName: uk_cart_items_item_id
        - addNotNullConstraint:
            tableName: cart_items
            columnName: user_id
            columnDataType: BIGINT
        - addNotNullConstraint:
            tableName: orders
            columnName: user_id
            columnDataType: BIGINT
        - addUniqueConstraint:
            tableName: cart_items
            columnNames: user_id, item_id
            constraintName: uk_cart_items_user_id_item_id
        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_cart_items_user_id_users_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_orders_user_id_users_id
            onDelete: CASCADE
        - createIndex:
            tableName: orders
            indexName: idx_orders_user_id
            columns:
              - column:
                  name: user_id
