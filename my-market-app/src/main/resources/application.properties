spring.application.name=my-market-app

server.port=${SERVER_PORT:8080}

# Runtime: R2DBC for application access + JDBC DataSource for Liquibase migrations
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/my_market_app}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:my_market_user}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:my_market_password}
spring.r2dbc.pool.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/my_market_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:my_market_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:my_market_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.thymeleaf.reactive.max-in-memory-size=2MB

# Сервис платежей (OpenAPI-клиент WebClient)
payment.service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8081}
