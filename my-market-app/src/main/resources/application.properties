spring.application.name=my-market-app

server.port=${SERVER_PORT:8080}

# Runtime: R2DBC for application access + JDBC DataSource for Liquibase migrations
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/my_market_app}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:my_market_user}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:my_market_password}
spring.r2dbc.pool.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/my_market_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:my_market_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:my_market_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.thymeleaf.reactive.max-in-memory-size=2MB

# Сервис платежей (OpenAPI-клиент WebClient)
payment.service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8081}
payment.oauth2.enabled=${PAYMENT_OAUTH2_ENABLED:true}
payment.oauth2.client-registration-id=${PAYMENT_OAUTH2_CLIENT_REGISTRATION_ID:payment-service-client}

# OAuth2 client credentials для доступа к сервису платежей через Keycloak.
spring.security.oauth2.client.registration.payment-service-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.payment-service-client.client-id=${PAYMENT_OAUTH2_CLIENT_ID:my-market-app-client}
spring.security.oauth2.client.registration.payment-service-client.client-secret=${PAYMENT_OAUTH2_CLIENT_SECRET:my-market-app-client-secret}
spring.security.oauth2.client.registration.payment-service-client.provider=keycloak
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8082/realms/my-market/protocol/openid-connect/token}

# Redis — кеш карточек товаров (реактивный Lettuce)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# TTL записей о товаре в Redis (ISO-8601 duration, например PT3M)
items.cache.ttl=${ITEMS_CACHE_TTL:PT3M}
