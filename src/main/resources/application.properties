spring.application.name=my-market-app

server.port=${SERVER_PORT:8080}

# Main/runtime profile: PostgreSQL + Liquibase
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/my_market_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:my_market_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:my_market_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

