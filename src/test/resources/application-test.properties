# Default tests: in-memory H2 for JDBC (Liquibase) + R2DBC.
# Note: JDBC mem and R2DBC mem are separate H2 instances — avoid R2DBC queries unless URLs are aligned.
# Интеграционный тест с PostgreSQL переопределяет URL через @DynamicPropertySource.
spring.datasource.url=jdbc:h2:mem:my_market_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.r2dbc.url=r2dbc:h2:mem:///my_market_test?options=MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
